# [[file:.starship.toml.org::*Prompt][Prompt:1]]
add_newline = true
format = """$all\n\r$character"""
right_format = "$time$battery"
# Prompt:1 ends here

# [[file:.starship.toml.org::*Main][Main:1]]
[cmd_duration]
  format = '\[[ $duration]($style)\] '
  show_notifications = true
  min_time_to_notify = 10000
[status]
[fill]
  symbol = "―"
[sudo]
  format = '\[[as $symbol]($style)\] '
[time]
  format = '[$time]($style)'
  style = "#4c566a"
  disabled = false
[username]
  format = '\[[$user]($style)\] '
[directory]
  truncate_to_repo = false
  fish_style_pwd_dir_length = 1
  read_only = " 󰌾"
  style = "bold blue"
[character]
[hostname]
  ssh_symbol = " "
[line_break]
  disabled = true
[localip]
[memory_usage]
  symbol = "󰍛 "
  format = '\[$symbol[$ram( | $swap)]($style)\] '
[netns]
[direnv]
[env_var]
[container]
[docker_context]
  symbol = " "
  format = '\[[$symbol$context]($style)\] '
[jobs]
[os]
  format = '\[[$symbol]($style)\] '
[package]
  symbol = "󰏗 "
  format = '\[[$symbol$version]($style)\] '
[shell]
# Main:1 ends here

# [[file:.starship.toml.org::*Battery][Battery:1]]
[battery]
  format = '[$symbol$percentage]($style)'
[[battery.display]]
  threshold = 100
  style = "italic dimmed green"
[[battery.display]]
  threshold = 80
  style = "italic dimmed yellow"
[[battery.display]]
  threshold = 25
  style = "italic bold red"
[[battery.display]]
  threshold = 5
  style = "italic bold purple"
# Battery:1 ends here

# [[file:.starship.toml.org::*Git][Git:1]]
[git_branch]
  symbol = " " # Nerd fonts
  format = '\[[$symbol$branch]($style)\] '
[git_commit]
  tag_symbol = '  ' # Nerd fonts
[git_state]
[git_metrics]
[git_status]
  format = '([\[$all_status$ahead_behind\]]($style) )'
# Git:1 ends here
[custom.jj]
  symbol = " " # Nerd fonts
  format = '\[[$symbol$output]($style)\]'
  when = "jj-starship detect"
  shell = ["jj-starship", "--no-jj-prefix", "--no-jj-id"]

