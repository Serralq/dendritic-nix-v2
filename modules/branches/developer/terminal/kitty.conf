font_family      Hermit
font_size        10

foreground #D8DEE9
background #202329
selection_foreground #D8DEE9
selection_background #434C5E

cursor #D8DEE9
cursor_text_color #2E3440

active_tab_foreground #D8DEE9
active_tab_background #3B4252
inactive_tab_foreground #D8DEE9
inactive_tab_background #2E3440

# Black
color0 #3B4252
color8 #4C566A

# Red
color1 #BF616A
color9 #BF616A

# Green
color2 #A3BE8C
color10 #A3BE8C

# Yellow
color3 #EBCB8B
color11 #EBCB8B

# Blue
color4 #81A1C1
color12 #81A1C1

